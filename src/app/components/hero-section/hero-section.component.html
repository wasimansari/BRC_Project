<section id="home" class="hero-section">
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
    <div class="carousel-indicators">
      <button *ngFor="let slide of slides; let i = index" 
              type="button" 
              data-bs-target="#heroCarousel" 
              [attr.data-bs-slide-to]="i" 
              (click)="goToSlide(i)"
              [class.active]="i === 0"
              [attr.aria-current]="i === 0 ? 'true' : null"
              [attr.aria-label]="'Slide ' + (i + 1)">
      </button>
    </div>
    
    <div class="carousel-inner">
      <div *ngFor="let slide of slides; let i = index" 
           class="carousel-item" 
           [class.active]="i === 0"
           [style.backgroundImage]="'url(' + slide.image + ')'">
        <div class="carousel-overlay"></div>
        <div class="carousel-caption-custom">
          <div class="container text-center">
            <h1 class="hero-title" [innerHTML]="formatTitle(slide.title)"></h1>
          </div>
        </div>
      </div>
    </div>
    
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev" (click)="prevSlide()">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next" (click)="nextSlide()">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</section>

<!-- Overlapping Hero Boxes -->
<div class="hero_boxes">
  <div class="container">
    <div class="row gx-0">
      <div class="col-lg-4 hero_box_col">
        <div class="hero_box">
          <i class="fas fa-globe"></i>
          <div class="hero_box_content">
            <h2 class="hero_box_title">Online Courses</h2>
            <a routerLink="/trainings" class="hero_box_link">view more</a>
          </div>
        </div>
      </div>
      <div class="col-lg-4 hero_box_col">
        <div class="hero_box">
          <i class="fas fa-book"></i>
          <div class="hero_box_content">
            <h2 class="hero_box_title">Our Library</h2>
            <a routerLink="/downloads" class="hero_box_link">view more</a>
          </div>
        </div>
      </div>
      <div class="col-lg-4 hero_box_col">
        <div class="hero_box">
          <i class="fas fa-user-graduate"></i>
          <div class="hero_box_content">
            <h2 class="hero_box_title">Our Teachers</h2>
            <a routerLink="/about" class="hero_box_link">view more</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="auth-page">
  <div class="auth-container">
    
    <!-- STANDARD LOGIN -->
    <ng-container *ngIf="!isForgotMode">
      <div class="auth-header">
        <div class="auth-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
        <h2>Teacher Login</h2>
        <p>Access your dashboard and documents</p>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
      </div>

      <form (ngSubmit)="onLogin()">
        <div class="form-group">
          <label>School UDISE Code</label>
          <div class="input-icon">
            <i class="fa-solid fa-school"></i>
            <input type="text" [(ngModel)]="udiseCode" name="udiseCode" class="form-control" placeholder="Enter UDISE code" required>
          </div>
        </div>

        <div class="form-group">
          <label class="d-flex justify-content-between">
            Password
            <a href="javascript:void(0)" class="text-muted small text-decoration-none" (click)="toggleForgotMode()">Forgot?</a>
          </label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Enter your password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="isLoading">
          <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Logging in...</span>
          <span *ngIf="!isLoading">Login to Dashboard <i class="fa-solid fa-arrow-right ms-2"></i></span>
        </button>
      </form>

      <div class="auth-footer mt-4 text-center">
        <p>New teacher? <a routerLink="/teacher/signup" class="brand-link">Register here</a></p>
      </div>
    </ng-container>

    <!-- FORGOT PASSWORD FLOW -->
    <ng-container *ngIf="isForgotMode">
      <div class="auth-header">
        <div class="auth-icon"><i class="fa-solid fa-key"></i></div>
        <h2>Reset Password</h2>
        <p>Recover access to your account</p>
      </div>

      <div class="alert alert-danger" *ngIf="errorMessage">
        <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
      </div>
      <div class="alert alert-success" *ngIf="message && !errorMessage">
        <i class="fa-solid fa-check-circle"></i> {{ message }}
      </div>

      <!-- Step 1: Request -->
      <form *ngIf="forgotStep === 1" (ngSubmit)="requestPasswordReset()">
        <div class="form-group">
          <label>School UDISE Code</label>
          <div class="input-icon">
            <i class="fa-solid fa-school"></i>
            <input type="text" [(ngModel)]="udiseCode" name="udiseCode" class="form-control" placeholder="Enter your UDISE code" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2" [disabled]="isLoading">
          <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Sending OTP...</span>
          <span *ngIf="!isLoading">Send Reset OTP</span>
        </button>
      </form>

      <!-- Step 2: Verify & Reset -->
      <form *ngIf="forgotStep === 2" (ngSubmit)="resetPassword()">
        <div class="text-center mb-4">
          <p class="text-muted">OTP sent to <strong>{{emailMasked}}</strong></p>
        </div>

        <div class="form-group text-center">
          <label>Enter 6-Digit OTP</label>
          <input type="text" [(ngModel)]="otp" name="otp" class="form-control otp-input" placeholder="------" maxlength="6" required autocomplete="off">
        </div>

        <div class="form-group mt-4">
          <label>New Password</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" [(ngModel)]="newPassword" name="newPassword" class="form-control" placeholder="Min 6 characters" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="isLoading || !otp || !newPassword">
          <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Resetting...</span>
          <span *ngIf="!isLoading">Save New Password</span>
        </button>
      </form>

      <div class="auth-footer mt-4 text-center">
        <a href="javascript:void(0)" class="brand-link" (click)="toggleForgotMode()"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
      </div>
    </ng-container>

  </div>
</div>

<div class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
      <h2>Teacher Registration</h2>
      <p>Join the BRC Teacher Portal to manage your documents</p>
    </div>

    <!-- Progress Steps -->
    <div class="progress-steps">
      <div class="step" [class.active]="currentStep >= 1" [class.completed]="currentStep > 1">
        <div class="step-num"><i class="fa-solid fa-check" *ngIf="currentStep > 1"></i><span *ngIf="currentStep === 1">1</span></div>
        <div class="step-text">Details</div>
      </div>
      <div class="step-line" [class.active]="currentStep >= 2"></div>
      <div class="step" [class.active]="currentStep >= 2" [class.completed]="currentStep > 2">
        <div class="step-num"><i class="fa-solid fa-check" *ngIf="currentStep > 2"></i><span *ngIf="currentStep === 2">2</span></div>
        <div class="step-text">Verify</div>
      </div>
      <div class="step-line" [class.active]="currentStep >= 3"></div>
      <div class="step" [class.active]="currentStep >= 3">
        <div class="step-num">3</div>
        <div class="step-text">Password</div>
      </div>
    </div>

    <!-- Alerts -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
    </div>
    <div class="alert alert-success" *ngIf="message && !errorMessage">
      <i class="fa-solid fa-check-circle"></i> {{ message }}
    </div>

    <!-- STEP 1: Details -->
    <form *ngIf="currentStep === 1" (ngSubmit)="onSignup()">
      <div class="form-group">
        <label>School UDISE Code <span class="text-danger">*</span></label>
        <div class="input-icon">
          <i class="fa-solid fa-school"></i>
          <input type="text" [(ngModel)]="signupData.udiseCode" name="udiseCode" class="form-control" placeholder="Enter 11-digit UDISE code" required>
        </div>
      </div>

      <div class="form-group">
        <label>Registered Mobile Number <span class="text-danger">*</span></label>
        <div class="input-icon">
          <i class="fa-solid fa-mobile-screen"></i>
          <input type="tel" [(ngModel)]="signupData.mobileNo" name="mobileNo" class="form-control" placeholder="Enter mobile number" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address (For OTP) <span class="text-danger">*</span></label>
        <div class="input-icon">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" [(ngModel)]="signupData.email" name="email" class="form-control" placeholder="Enter Gmail address" required>
        </div>
      </div>

      <div class="form-group">
        <label>Full Name (Optional)</label>
        <div class="input-icon">
          <i class="fa-solid fa-user"></i>
          <input type="text" [(ngModel)]="signupData.fullName" name="fullName" class="form-control" placeholder="Enter your name">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="isLoading">
        <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Verifying...</span>
        <span *ngIf="!isLoading">Verify & Send OTP <i class="fa-solid fa-arrow-right ms-2"></i></span>
      </button>
    </form>

    <!-- STEP 2: Verify OTP -->
    <form *ngIf="currentStep === 2" (ngSubmit)="onVerifyOtp()">
      <div class="text-center mb-4">
        <p class="text-muted">An OTP has been sent to <strong>{{signupData.email}}</strong></p>
      </div>

      <div class="form-group text-center">
        <label>Enter 6-Digit OTP</label>
        <input type="text" [(ngModel)]="otp" name="otp" class="form-control otp-input" placeholder="------" maxlength="6" required autocomplete="off">
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="isLoading || !otp || otp.length < 6">
        <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Verifying...</span>
        <span *ngIf="!isLoading">Verify OTP</span>
      </button>

      <div class="text-center mt-4">
        <button type="button" class="btn btn-link btn-resend" (click)="resendOtp()" [disabled]="resendCooldown > 0 || isLoading">
          <i class="fa-solid fa-rotate-right"></i> 
          {{ resendCooldown > 0 ? 'Resend OTP in ' + resendCooldown + 's' : 'Resend OTP' }}
        </button>
      </div>
    </form>

    <!-- STEP 3: Set Password -->
    <form *ngIf="currentStep === 3" (ngSubmit)="onSetPassword()">
      <div class="text-center mb-4">
        <p class="text-success fw-bold"><i class="fa-solid fa-check-circle"></i> Email Verified!</p>
        <p class="text-muted">Please set a password for your account.</p>
      </div>

      <div class="form-group">
        <label>New Password <span class="text-danger">*</span></label>
        <div class="input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" [(ngModel)]="newPassword" name="newPassword" class="form-control" placeholder="Min 6 characters" required minlength="6">
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password <span class="text-danger">*</span></label>
        <div class="input-icon">
          <i class="fa-solid fa-lock-check"></i>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="isLoading || !newPassword || !confirmPassword">
        <span *ngIf="isLoading"><i class="fa-solid fa-spinner fa-spin"></i> Saving...</span>
        <span *ngIf="!isLoading"><i class="fa-solid fa-check me-2"></i> Create Account</span>
      </button>
    </form>

    <div class="auth-footer mt-4 text-center">
      <p>Already have an account? <a routerLink="/teacher/login" class="brand-link">Login here</a></p>
    </div>
  </div>
</div>

<div class="teacher-signup-container">
  <div class="teacher-card">
    <h2>Teacher Signup</h2>
    <form (ngSubmit)="onSignup()">
      <div class="form-group">
        <label for="udiseCode">UDISE Code</label>
        <input type="text" id="udiseCode" name="udiseCode" class="form-control" [(ngModel)]="signupData.udiseCode" required>
      </div>

      <div class="form-group">
        <label for="mobileNo">Mobile Number</label>
        <input type="text" id="mobileNo" name="mobileNo" class="form-control" [(ngModel)]="signupData.mobileNo" required>
      </div>

      <div class="form-group">
        <label for="schoolName">School Name</label>
        <input type="text" id="schoolName" name="schoolName" class="form-control" [(ngModel)]="signupData.schoolName" required>
      </div>

      <div class="form-group">
        <label for="fullName">Teacher Name (optional)</label>
        <input type="text" id="fullName" name="fullName" class="form-control" [(ngModel)]="signupData.fullName">
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
        {{ isLoading ? 'Signing up...' : 'Sign Up' }}
      </button>
    </form>

    <p class="mt-3 text-center">
      Already registered? <a routerLink="/teacher/login">Login here</a>
    </p>
  </div>
</div>
